<head>
  <meta charset="UTF-8" />

  <meta property="og:site_name" content="좆좆소" />

  <meta property="og:locale" content="ko_KR" />
  <meta property="og:image" content="https://jjokjjokso.pages.dev/assets/og.png" />

  <meta property="og:image:height" content="630" />
  <meta name="twitter:image" content="https://jjokjjokso.pages.dev/assets/og.png" />

  <meta name="google-site-verification" content="90ObN9YY1jH6ZHRfL3tGx5HvKoHC8boT6jdFhbSe80s" />
  <meta name="naver-site-verification" content="d2a2ac902bd5f6859e33c5c7f0665f99d04b1e31" />
</head>
<body data-page="board">

  <header class="site-header">
    <div class="container">
      <a class="brand" href="index.html">
        <span class="brand-mark">JJ</span>
        <span><span class="brand-name">좆좆소</span><span class="brand-sub">JJOKJJOKSO</span></span>
      </a>
      <nav class="nav-links">
        <a href="board.html" data-nav="board">자유게시판</a>
        <a href="https://blackconsumer.vercel.app/">블랙컨슈머</a>
        <a href="board.html#write" class="btn btn-accent btn-sm">글쓰기</a>
      </nav>
    </div>
  </header>

  <main>
    <section class="page-head">
      <div class="container-narrow">
        <div class="breadcrumbs"><a href="index.html">홈</a> <span>›</span> <a href="board.html">자유게시판</a></div>
        <h1 id="v-title">불러오는 중…</h1>
        <p id="v-meta" class="muted" style="margin:0"></p>
      </div>
    </section>

    <section class="section" style="padding-top:34px">
      <div class="container-narrow" style="display:grid; gap:24px">

        <div class="card card-pad">
          <div id="v-top" style="display:flex; gap:8px; flex-wrap:wrap; margin-bottom:16px"></div>
          <div id="v-body" style="white-space:pre-wrap; font-size:16px; line-height:1.8; color:var(--ink-2)"></div>
          <div id="v-images" style="display:flex; gap:12px; flex-wrap:wrap; margin-top:18px" hidden></div>

          <div style="display:flex; gap:10px; align-items:center; flex-wrap:wrap; margin-top:26px; padding-top:18px; border-top:1.5px solid var(--line)">
            <button class="btn btn-secondary btn-sm" id="v-like">추천 <span id="v-like-count">0</span></button>
            <span class="small muted">댓글 <span id="v-comment-count">0</span></span>
            <span style="flex:1"></span>
            <button class="btn btn-ghost btn-sm" id="v-edit">수정</button>
            <button class="btn btn-ghost btn-sm" id="v-del">삭제</button>
            <a class="btn btn-ghost btn-sm" href="board.html">← 목록으로</a>
          </div>

          <div id="pw-box" style="display:none; margin-top:16px; padding:14px; border:1.5px dashed var(--line); border-radius:10px; gap:10px">
            <strong style="font-size:14.5px" id="pw-title">비밀번호 확인</strong>
            <div style="display:flex; gap:8px; flex-wrap:wrap; align-items:center">
              <input class="input" type="password" id="pw-input" maxlength="20" placeholder="글쓰기 때 설정한 비밀번호" autocomplete="current-password" style="flex:1; min-width:170px" />
              <button class="btn btn-primary btn-sm" id="pw-ok">확인</button>
              <button class="btn btn-ghost btn-sm" id="pw-cancel">취소</button>
            </div>
          </div>

          <div id="edit-box" style="display:none; margin-top:16px; gap:10px">
            <input class="input" id="e-title" maxlength="120" placeholder="제목" />
            <textarea class="textarea" id="e-body" style="min-height:220px" placeholder="내용"></textarea>
            <div style="display:flex; gap:8px">
              <button class="btn btn-primary btn-sm" id="e-save">저장</button>
              <button class="btn btn-ghost btn-sm" id="e-cancel">취소</button>
            </div>
          </div>
        </div>

        <div class="card card-pad">
          <div class="section-title" style="margin-bottom:8px">
            <h2 style="font-size:21px; margin:0">댓글 <span class="muted" id="v-cm-n"></span></h2>
          </div>
          <p class="small muted">서로 존중하는 대화 부탁드립니다. 비방·개인정보 유포 댓글은 삭제됩니다.</p>
          <form id="comment-form" style="display:grid; gap:10px; margin:16px 0 22px">
            <input class="input" id="c-name" placeholder="표시명 (비워두면 익명)" maxlength="20" />
            <textarea class="textarea" id="c-body" style="min-height:96px" placeholder="댓글을 입력하세요 (2자 이상)"></textarea>
            <div><button class="btn btn-primary btn-sm" type="submit">댓글 작성</button></div>
          </form>
          <div id="v-comments"></div>
        </div>

      </div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container">
      <div>
        <div class="footer-brand"><span class="brand-mark">JJ</span> 좆좆소</div>
        <p class="footer-note">부담 없이 쓰는 자유게시판. 비방·욕설·개인정보가 담긴 글은 삭제될 수 있습니다.</p>
      </div>
      <div>
        <h4>바로가기</h4>
        <a href="board.html#write">글 쓰기</a>
        <a href="board.html">자유게시판</a>
        <a href="index.html">홈</a>
      </div>
      <div>
        <h4>관련 사이트</h4>
        <a href="https://blackconsumer.vercel.app/">블랙컨슈머 (BLACKARCHIVE)</a>
        <p class="footer-note">이름·연락처·차량번호·인상착의로 검색하는 블랙컨슈머 제보 아카이브</p>
      </div>
    </div>
    <div class="container footer-bottom">© <span id="year"></span> 좆좆소 (JJOKJJOKSO)</div>
  </footer>

  <script type="module" src="assets/js/board-view.js"></script>
</body>
</html>
